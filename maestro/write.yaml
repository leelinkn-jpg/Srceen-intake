appId: com.linkn.screenintake
name: write-persist
---
- launchApp
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "欢迎使用「秒记」"
    commands:
      - scrollUntilVisible:
          element: "我已了解，进入应用"
          direction: DOWN
          timeout: 20000
      - tapOn: "我已了解，进入应用"
      - waitForAnimationToEnd:
          timeout: 5000
- tapOn: "财务"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "卡片"
- tapOn: "添加一张卡"
- tapOn: "卡名称"
- inputText: "MaestroCard"
- tapOn:
    text: "^添加$"
- takeScreenshot: after-add-card
- extendedWaitUntil:
    visible: "MaestroCard"
    timeout: 12000
- tapOn: "MaestroCard"
- tapOn:
    text: "^删除$"
- extendedWaitUntil:
    notVisible: "MaestroCard"
    timeout: 8000
- tapOn: "成长"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "我的项目"
- tapOn: "＋ 新增项目"
- tapOn: "项目名称"
- inputText: "MaestroItem"
- tapOn:
    text: "^保存$"
- extendedWaitUntil:
    visible: "MaestroItem"
    timeout: 8000
- tapOn: "MaestroItem"
- tapOn: "归档项目"
- extendedWaitUntil:
    notVisible: "MaestroItem"
    timeout: 8000
